/**:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - left_fr3_finger_joint1
      - left_fr3_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0

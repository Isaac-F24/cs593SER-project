controller_names:
  - fr3_arm_controller
  - fr3_gripper
  - left_fr3_arm_controller
  - left_fr3_gripper
  - right_fr3_arm_controller
  - right_fr3_gripper

fr3_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - fr3_joint1
    - fr3_joint2
    - fr3_joint3
    - fr3_joint4
    - fr3_joint5
    - fr3_joint6
    - fr3_joint7

fr3_gripper:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - fr3_finger_joint1
      - fr3_finger_joint2

left_fr3_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - left_fr3_joint1
    - left_fr3_joint2
    - left_fr3_joint3
    - left_fr3_joint4
    - left_fr3_joint5
    - left_fr3_joint6
    - left_fr3_joint7

left_fr3_gripper:
    action_ns: gripper_action
    type: GripperCommand
    default: true
    joints:
      - left_fr3_finger_joint1
      - left_fr3_finger_joint2

right_fr3_arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - right_fr3_joint1
    - right_fr3_joint2
    - right_fr3_joint3
    - right_fr3_joint4
    - right_fr3_joint5
    - right_fr3_joint6
    - right_fr3_joint7

